name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Convert Web App to Android APK
        run: |
          # 1. Check index.html location
          INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi
          echo "Found index.html at $INDEX_PATH"

          # 2. Setup packaging directory
          mkdir -p www
          cp "$INDEX_PATH" www/index.html

          # 3. Install Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 4. Create App Configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.musclestrength.app",
            "appName": "Muscle & Strength",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # 5. Build Android Project & Compile APK
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muscle-Strength-India-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
